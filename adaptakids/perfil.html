<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu perfil — AdaptaKids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="api.js"></script>
<style>
  .profile-card{background:#fff;border-radius:var(--radius-md); box-shadow:var(--shadow-sm); padding:30px; max-width:640px;}
  .form-erro{background:#FEF2F2; color:#B91C1C; border:1px solid #FCA5A5; border-radius:10px; padding:10px 14px; font-size:0.88rem; margin-bottom:16px; display:none;}
  .form-sucesso{background:#ECFDF5; color:#047857; border:1px solid #A7F3D0; border-radius:10px; padding:10px 14px; font-size:0.88rem; margin-bottom:16px; display:none;}
  .profile-avatar{background-size:cover; background-position:center;}
  .profile-head{display:flex; align-items:center; gap:20px; margin-bottom:28px; padding-bottom:26px; border-bottom:1px solid var(--border);}
  .profile-avatar{
    width:84px;height:84px;border-radius:50%;
    background: linear-gradient(135deg, var(--secondary), var(--primary));
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:1.7rem;
    flex-shrink:0;
  }
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:600px){.two-col{grid-template-columns:1fr;}}
</style>
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <a href="index.html" class="logo">
        <span class="logo-badge" style="background:rgba(255,255,255,0.18);">🧩</span>
        <span><span class="a-part">Adapta</span><span class="k-part">Kids</span></span>
      </a>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
          Dashboard
        </a>
        <a href="nova-adaptacao.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M12 12v6M9 15h6"/></svg>
          Nova adaptação
        </a>
        <a href="historico.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          Histórico
        </a>
        <a href="favoritos.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6.7-4.35-9.3-8.1C.8 9.9 1.9 6.2 5.1 5.1c2-.7 4 .1 5.1 1.8C11.3 5.2 13.3 4.4 15.3 5.1c3.2 1.1 4.3 4.8 2.4 7.8C18.7 16.65 12 21 12 21z"/></svg>
          Favoritos
        </a>
        <a href="perfil.html" class="active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          Perfil
        </a>
        <a href="#">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.14.36.4.68.74.92.34.24.6.32 1.86.32v0"/></svg>
          Configurações
        </a>
      </nav>
      <a href="#" class="sidebar-logout" data-logout>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sair
      </a>
    </aside>

    <main class="app-main">
      <div class="app-topbar">
        <div>
          <h1>Meu perfil</h1>
          <p class="subtitle">Atualize suas informações pessoais.</p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn-circle" aria-label="Notificações">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
            <span class="dot"></span>
          </button>
          <div class="avatar">A</div>
        </div>
      </div>

      <div class="profile-card">
        <div id="formErro" class="form-erro"></div>
        <div id="formSucesso" class="form-sucesso"></div>

        <div class="profile-head">
          <div class="profile-avatar" id="profileAvatar">?</div>
          <div>
            <button class="btn btn-outline btn-sm" id="btnAlterarFoto" type="button">Alterar foto</button>
            <input type="file" id="inputFoto" accept="image/png" style="display:none;">
            <p style="font-size:0.78rem; color:var(--text-faint); margin-top:8px;">Apenas arquivos PNG.</p>
          </div>
        </div>

        <form id="formPerfil">
          <div class="form-group">
            <label for="nome">Nome completo</label>
            <input class="form-control" type="text" id="nome" required>
          </div>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input class="form-control" type="email" id="email" required>
          </div>
          <div class="form-group" style="margin-bottom:26px;">
            <label for="senha">Nova senha</label>
            <input class="form-control" type="password" id="senha" placeholder="Deixe em branco para manter a senha atual" minlength="6">
          </div>
          <button type="submit" class="btn btn-primary" id="btnSalvar">Salvar alterações</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    let usuarioAtual = null;

    function atualizarAvatar(usuario) {
      const avatar = document.getElementById('profileAvatar');
      if (usuario.foto_path) {
        avatar.style.backgroundImage = `url('${usuario.foto_path}')`;
        avatar.textContent = '';
      } else {
        avatar.style.backgroundImage = '';
        avatar.textContent = iniciaisDoNome(usuario.nome);
      }
    }

    (async () => {
      usuarioAtual = await exigirLogin();
      if (!usuarioAtual) return;
      hidratarUsuarioNaTopbar(usuarioAtual);
      atualizarAvatar(usuarioAtual);
      document.getElementById('nome').value = usuarioAtual.nome;
      document.getElementById('email').value = usuarioAtual.email;
    })();

    document.getElementById('formPerfil').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erroBox = document.getElementById('formErro');
      const sucessoBox = document.getElementById('formSucesso');
      const botao = document.getElementById('btnSalvar');
      erroBox.style.display = 'none';
      sucessoBox.style.display = 'none';

      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      botao.disabled = true;
      botao.textContent = 'Salvando...';
      try {
        const { usuario } = await apiRequest('/perfil', {
          method: 'PUT',
          body: JSON.stringify({ nome, email, senha })
        });
        usuarioAtual = usuario;
        hidratarUsuarioNaTopbar(usuario);
        atualizarAvatar(usuario);
        document.getElementById('senha').value = '';
        sucessoBox.textContent = 'Alterações salvas com sucesso.';
        sucessoBox.style.display = 'block';
      } catch (err) {
        erroBox.textContent = err.message;
        erroBox.style.display = 'block';
      } finally {
        botao.disabled = false;
        botao.textContent = 'Salvar alterações';
      }
    });

    document.getElementById('btnAlterarFoto').addEventListener('click', () => {
      document.getElementById('inputFoto').click();
    });

    document.getElementById('inputFoto').addEventListener('change', async (e) => {
      const erroBox = document.getElementById('formErro');
      const sucessoBox = document.getElementById('formSucesso');
      erroBox.style.display = 'none';
      sucessoBox.style.display = 'none';

      const arquivo = e.target.files[0];
      if (!arquivo) return;

      if (arquivo.type !== 'image/png') {
        erroBox.textContent = 'Apenas arquivos no formato PNG são permitidos.';
        erroBox.style.display = 'block';
        e.target.value = '';
        return;
      }

      const formData = new FormData();
      formData.append('foto', arquivo);

      try {
        const { foto_path } = await apiRequest('/perfil/foto', { method: 'POST', body: formData });
        usuarioAtual.foto_path = foto_path;
        atualizarAvatar(usuarioAtual);
        hidratarUsuarioNaTopbar(usuarioAtual);
        sucessoBox.textContent = 'Foto de perfil atualizada.';
        sucessoBox.style.display = 'block';
      } catch (err) {
        erroBox.textContent = err.message;
        erroBox.style.display = 'block';
      } finally {
        e.target.value = '';
      }
    });
  </script>

</body>
</html>
